name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black / flake8 / isort, informational)
    runs-on: ubuntu-latest
    # Lint is informational because the existing codebase has not yet
    # been normalized to black / flake8 / isort (at adoption time:
    # ~48 files need black reformatting, 2625 flake8 violations).
    # Surfaces issues per-PR without blocking merges. Promote to a
    # required check after a one-shot codebase-format PR lands.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "black>=24.0.0" "flake8>=7.0.0" "isort>=5.13.0"

      - name: Run black (check only)
        run: black --check --line-length=88 src/ tests/

      - name: Run isort (check only)
        run: isort --check-only --profile=black --line-length=88 src/ tests/

      - name: Run flake8
        run: flake8 src/ tests/

  typecheck:
    name: Type check (mypy, informational)
    runs-on: ubuntu-latest
    # mypy is informational because pyproject.toml uses strict settings that
    # are not yet fully satisfied by the codebase. Failures are surfaced but
    # do not block merging.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run the full offline test suite. Live / e2e tests are auto-marked
      # via tests/conftest.py (LIVE_TEST_FILENAME_PATTERNS) and excluded
      # by ``-m "not e2e"``. Pass ``--run-e2e`` locally to include them.
      # Resolves Deferred Risk R2 (marker separation) in
      # reviews/REVIEW_TRACKING.md.
      - name: Run offline test suite
        run: pytest -m "not e2e" -q
        env:
          PYTHONPATH: ${{ github.workspace }}
